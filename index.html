<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Custom Connections</title>
<style>
  :root { --bg:#f7f7f7; --tile:#e7e7e7; --dark:#111; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:#111; font-family:Arial,Helvetica,sans-serif; }
  .wrap { width:min(680px,94vw); margin:auto; padding:28px 0 42px; text-align:center; }
  h1 { margin:0 0 7px; font-size:34px; }
  .sub { margin:0 auto 18px; line-height:1.35; }
  .status { font-weight:700; margin:12px 0; }
  #mistakes { letter-spacing:3px; }
  #solved { display:flex; flex-direction:column; gap:7px; margin:14px 0; }
  .group { border-radius:8px; padding:12px 8px; font-weight:800; text-transform:uppercase; }
  .group div { margin-top:4px; font-size:13px; font-weight:600; }
  .c0{background:#f4d96b}.c1{background:#a9d7a6}.c2{background:#b8c9f2}
  .c3{background:#c9b7e8}.c4{background:#efb4c4}
  #grid { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin:16px 0; }
  .word {
    min-height:76px; border:0; border-radius:7px; padding:6px 3px;
    background:var(--tile); font-size:clamp(11px,2.7vw,16px);
    font-weight:800; cursor:pointer; text-transform:uppercase;
  }
  .word.selected { background:#5b5a50; color:white; }
  .buttons { display:flex; justify-content:center; gap:9px; flex-wrap:wrap; }
  button.action {
    padding:10px 18px; border-radius:22px; border:1px solid #777;
    background:white; font-weight:700; cursor:pointer;
  }
  button.primary { background:var(--dark); color:white; border-color:var(--dark); }
  #message { min-height:26px; margin:10px 0; font-weight:700; }
  #end { display:none; margin-top:18px; }
  .note { color:#555; font-size:12px; margin-top:15px; }
</style>
</head>
<body>
<main class="wrap">
  <h1>Connections</h1>
  <p class="sub">Create five groups of four. Select four words and press <b>Submit</b>.</p>

  <div class="status">Mistakes remaining: <span id="mistakes">● ● ● ●</span></div>

  <section id="solved"></section>
  <section id="grid" aria-label="Words"></section>
  <div id="message" aria-live="polite"></div>

  <div class="buttons">
    <button class="action" id="shuffle">Shuffle</button>
    <button class="action primary" id="submit">Submit</button>
    <button class="action" id="reset">New Game</button>
  </div>

  <section id="end">
    <h2 id="endTitle"></h2>
    <p id="endText"></p>
  </section>

  <p class="note">This page is completely self-contained and does not need an internet connection.</p>
</main>

<script>
"use strict";

const GROUPS = [
  { name:"Anime protagonists", words:["MONKEY","LIGHT","EDWARD","THORFINN"], color:"c0" },
  { name:"Clever", words:["SHARP","BRIGHT","BRILLIANT","CANNY"], color:"c1" },
  { name:"Adhesives", words:["GORILLA","SCOTCH","SUPER","ELECTRICAL"], color:"c2" },
  { name:"Words whose first two syllables are chemical elements",
    words:["OXYMORON","KRYPTONITE","NITRO","RADIANT"], color:"c3" },
  { name:"__ peaks", words:["SPANISH","TWIN","VOLTAGE","RESONANCE"], color:"c4" }
];

let remaining, selected, solved, mistakes, gameOver;

function freshWords() {
  return GROUPS.flatMap(g => g.words);
}

function resetGame() {
  remaining = freshWords();
  selected = [];
  solved = [];
  mistakes = 4;
  gameOver = false;
  document.getElementById("end").style.display = "none";
  setMessage("");
  shuffle(false);
  render();
}

function shuffle(showMessage=true) {
  for (let i=remaining.length-1; i>0; i--) {
    const j=Math.floor(Math.random()*(i+1));
    [remaining[i],remaining[j]]=[remaining[j],remaining[i]];
  }
  if (showMessage) setMessage("");
  render();
}

function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  remaining.forEach(word => {
    const b = document.createElement("button");
    b.className = "word" + (selected.includes(word) ? " selected" : "");
    b.textContent = word;
    b.disabled = gameOver;
    b.addEventListener("click", () => toggle(word));
    grid.appendChild(b);
  });

  document.getElementById("mistakes").textContent =
    mistakes ? Array(mistakes).fill("●").join(" ") : "—";

  const solvedBox = document.getElementById("solved");
  solvedBox.innerHTML = "";
  solved.forEach((name) => {
    const g = GROUPS.find(x => x.name === name);
    const box = document.createElement("div");
    box.className = "group " + g.color;
    box.innerHTML = g.name + "<div>" + g.words.join(" • ") + "</div>";
    solvedBox.appendChild(box);
  });
}

function toggle(word) {
  if (gameOver) return;
  if (selected.includes(word)) {
    selected = selected.filter(x => x !== word);
  } else if (selected.length < 4) {
    selected.push(word);
  }
  render();
}

function setMessage(text) {
  document.getElementById("message").textContent = text;
}

function submitGuess() {
  if (gameOver) return;

  if (selected.length !== 4) {
    setMessage("Select exactly four words.");
    return;
  }

  const target = GROUPS.find(g =>
    !solved.includes(g.name) &&
    g.words.every(w => selected.includes(w))
  );

  if (target) {
    solved.push(target.name);
    remaining = remaining.filter(w => !target.words.includes(w));
    selected = [];
    setMessage("Correct!");
    render();

    if (solved.length === GROUPS.length) endGame(true);
    return;
  }

  mistakes--;
  const oneAway = GROUPS.some(g =>
    !solved.includes(g.name) &&
    selected.filter(w => g.words.includes(w)).length === 3
  );

  selected = [];
  setMessage(oneAway ? "One away..." : "Not quite.");
  render();

  if (mistakes === 0) endGame(false);
}

function endGame(won) {
  gameOver = true;
  document.getElementById("end").style.display = "block";
  document.getElementById("endTitle").textContent =
    won ? "You solved it!" : "Game over";
  document.getElementById("endText").textContent =
    won ? "You found all five categories." : "The remaining solutions are shown below.";

  if (!won) {
    GROUPS.forEach(g => {
      if (!solved.includes(g.name)) solved.push(g.name);
    });
    remaining = [];
    render();
  }
}

document.getElementById("shuffle").addEventListener("click", () => shuffle());
document.getElementById("submit").addEventListener("click", submitGuess);
document.getElementById("reset").addEventListener("click", resetGame);

resetGame();
</script>
</body>
</html>
